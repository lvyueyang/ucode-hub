# 开发环境 docker compose（开箱即用，无需创建 .env）
# 启动：
#   docker compose up -d            # 在本仓库根目录（hub/）执行
#
# 构建上下文就是本仓库根，Dockerfile 在根下：
#   docker build -t hub .
#
# 如需自定义配置，创建 .env 覆盖对应变量（模板在 app/.env.example）：
#   cp app/.env.example .env

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hub-app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-3009}:3009"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:5432/app_web}
      STORAGE_DIR: /app/data
      JWT_SECRET: ${JWT_SECRET:-dev-secret-at-least-32-characters-long}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      # 认证 Cookie Secure 标志（可选）：线上未启用 HTTPS 时须设 COOKIE_SECURE=false
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    volumes:
      - ./.volumes/app:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 1g
    mem_reservation: 256m
    restart: unless-stopped
