# 生产环境 docker compose 部署（SQLite 单文件库，无独立数据库容器）
# 部署目录：/opt/hub/（由 DEPLOY_DIR 覆盖，见各脚本）
# 部署命令：TAG=latest ./deploy.sh
#
# 服务器目录结构（/opt/hub/）：
#   ├── docker-compose.yml
#   ├── .env                      # 全部配置（见 .env.example）
#   └── volumes/
#       └── app/                  # 应用数据 + SQLite 库 data.db（宿主属主 1001:1001）
#
# .env 必填项（模板默认值见 .env.example）：
#   JWT_SECRET（至少 32 位随机字符串）
# 应用侧必需项 DATABASE_URL / JWT_SECRET / STORAGE_DIR 均由本文件注入；
# 应用启动时校验它们（规则见 app/src/env.ts），缺失或取值非法即拒绝启动

services:
  app:
    image: ghcr.io/ucode/hub:${TAG:-latest}
    container_name: hub-app
    ports:
      - "127.0.0.1:${APP_PORT:-3009}:3009"
    environment:
      # 容器内 Nitro 监听端口，与下面的端口映射、healthcheck 保持一致
      PORT: "3009"
      # SQLite 库文件路径（相对容器工作目录 /app，即挂载卷内的 volumes/app/data.db）；
      # 库文件与它的 -wal / -shm 三件套必须同卷持久化，换路径等于换库
      DATABASE_URL: ${DATABASE_URL:-./data/data.db}
      # 必须与下面的挂载点一致：改到卷外的路径，数据会随容器重建丢失
      STORAGE_DIR: /app/data
      JWT_SECRET: ${JWT_SECRET}
      # 以下均为可选：未设置时用应用内默认值，设置则必须合法（否则启动失败）
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:-}
      # 只接受 true / false；线上未启用 HTTPS 时必须设 false
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      # 隧道回灌的父域（可选）：设了才启用子域 ingress，需泛域名解析与泛域名证书
      HUB_BASE_DOMAIN: ${HUB_BASE_DOMAIN:-}
    volumes:
      - ./volumes/app:/app/data
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 2g
    mem_reservation: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3009/health').then(function(r){if(!r.ok)process.exit(1)}).catch(function(){process.exit(1)})\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
