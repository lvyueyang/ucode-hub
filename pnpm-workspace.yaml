packages:
  - "app"
  - "packages/*"

# 跨包共用的依赖版本只写在这里，各 package.json 用 "catalog:" 引用；只在单个包里用的依赖仍写在原地
catalog:
  "@ant-design/icons": ^6.3.4
  "@easyx/editor": ^2.0.0
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/devtools-vite": ^0.8.5
  "@tanstack/react-router": ^1.170.44
  "@testing-library/react": ^16.3.3
  "@types/node": ^24.10.1
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  "@vitejs/plugin-react": ^6.1.1
  antd: ^6.6.6
  class-variance-authority: ^0.7.1
  dayjs: ^1.11.23
  i18next: ^26.4.2
  jsdom: ^30.1.2
  monaco-editor: ^0.57.0
  pino: ^10.3.1
  react: ^19.3.0
  react-dom: ^19.3.0
  react-i18next: ^17.0.15
  sonner: ^2.0.8
  tailwindcss: ^4.3.3
  tsx: ^4.23.15
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  vite: ^8.3.1
  vitest: ^5.0.4
  zod: ^4.6.5

# 用 pnpm 自带的 JS shell 执行脚本：脚本里的行内环境变量赋值（`NODE_ENV=test …`）
# 在 Windows 的 cmd.exe 下不成立
shellEmulator: true

# 允许执行安装脚本的依赖（pnpm 默认阻止）
allowBuilds:
  "@alicloud/openapi-core": false
  esbuild: true
  protobufjs: true

# 这些版本不进 age 门槛：上游刚发布的版本等不到「已发布 N 天」
minimumReleaseAgeExclude:
  - "@easyx/editor@1.1.1 || 1.1.2 || 2.0.0"
  - "@easyx/image-toolkit@0.1.0 || 1.0.0"
  - "@easyx/tiptap-table-plus@1.0.1"
  - "@playwright/test@1.64.1"
  - "@tanstack/ai@0.52.2"
  - "@tanstack/react-start-rsc@0.1.63"
  - "@tanstack/react-start-server@1.167.50"
  - "@tanstack/react-start@1.169.2"
  - "@tanstack/router-generator@1.167.44"
  - "@tanstack/router-plugin@1.168.46"
  - "@tanstack/router-utils@1.162.4"
  - "@tanstack/start-plugin-core@1.171.53"
  - "@tanstack/start-server-core@1.169.43"
  - dotenv@18.0.8
  - i18next@26.4.5
  - lucide-react@1.57.0
  - openai@7.34.0
  - playwright-core@1.64.1
  - playwright@1.64.1
  - react-dom@19.3.1
  - react@19.3.1
